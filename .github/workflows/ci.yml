name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        # bun.lockb can be rewritten by newer Bun versions, even if dependencies
        # did not change. Using --frozen-lockfile makes CI fail spuriously.
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        env:
          # Dummy values for CI build (client validates presence)
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy
        run: bun run build
