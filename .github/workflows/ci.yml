# CI: lint, build, și teste de integrare de securitate (RLS).
#
# OBLIGATORIU pentru merge: Configurați în GitHub:
#   Settings → Secrets and variables → Actions → Secrets:
#   - VITE_SUPABASE_URL        (URL-ul proiectului Supabase, ex: https://xxx.supabase.co)
#   - VITE_SUPABASE_PUBLISHABLE_KEY (anon/public key din Supabase Dashboard)
#
# Opțional (pentru acoperire completă a testelor):
#   - VITE_TEST_STUDENT_EMAIL / VITE_TEST_STUDENT_PASSWORD
#   - VITE_TEST_TEACHER_EMAIL / VITE_TEST_TEACHER_PASSWORD
#   - VITE_TEST_PARENT_EMAIL / VITE_TEST_PARENT_PASSWORD
#   - VITE_TEST_TEACHER_SCHOOL_B_EMAIL / VITE_TEST_TEACHER_SCHOOL_B_PASSWORD
#   - VITE_TEST_DIRECTOR_EMAIL / VITE_TEST_DIRECTOR_PASSWORD
#
# Protecție branch: Settings → Branches → Add rule for main:
#   - Require status checks: build-and-lint, security-integration-tests
#   - Fără aceste verificări trecute, niciun PR nu poate fi îmbinat.
#
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        # bun.lockb can be rewritten by newer Bun versions, even if dependencies
        # did not change. Using --frozen-lockfile makes CI fail spuriously.
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        env:
          # Dummy values for CI build (client validates presence only)
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy
        run: bun run build

  security-integration-tests:
    runs-on: ubuntu-latest
    env:
      # Secrete injectate – fără ele job-ul eșuează; nicio modificare nu poate fi îmbinată
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Opțional: credențiale pentru teste complete
      VITE_TEST_STUDENT_EMAIL: ${{ secrets.VITE_TEST_STUDENT_EMAIL }}
      VITE_TEST_STUDENT_PASSWORD: ${{ secrets.VITE_TEST_STUDENT_PASSWORD }}
      VITE_TEST_TEACHER_EMAIL: ${{ secrets.VITE_TEST_TEACHER_EMAIL }}
      VITE_TEST_TEACHER_PASSWORD: ${{ secrets.VITE_TEST_TEACHER_PASSWORD }}
      VITE_TEST_PARENT_EMAIL: ${{ secrets.VITE_TEST_PARENT_EMAIL }}
      VITE_TEST_PARENT_PASSWORD: ${{ secrets.VITE_TEST_PARENT_PASSWORD }}
      VITE_TEST_TEACHER_SCHOOL_B_EMAIL: ${{ secrets.VITE_TEST_TEACHER_SCHOOL_B_EMAIL }}
      VITE_TEST_TEACHER_SCHOOL_B_PASSWORD: ${{ secrets.VITE_TEST_TEACHER_SCHOOL_B_PASSWORD }}
      VITE_TEST_DIRECTOR_EMAIL: ${{ secrets.VITE_TEST_DIRECTOR_EMAIL }}
      VITE_TEST_DIRECTOR_PASSWORD: ${{ secrets.VITE_TEST_DIRECTOR_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase secrets are configured
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL și VITE_SUPABASE_PUBLISHABLE_KEY trebuie configurate ca repository secrets."
            echo "Adăugați-le în: Settings → Secrets and variables → Actions → New repository secret"
            echo "Fără aceste secrete, testele de securitate nu pot rula și niciun PR nu poate fi îmbinat."
            exit 1
          fi
          echo "✓ Secrete Supabase configurate"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install

      - name: Run security integration tests
        run: bun run test -- --run src/test/integration/grades-security.integration.test.ts
